name: One-time import from HandsomeYun

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-source-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-source-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'Zhang-gw97/Zhang-gw97.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace target contents with pinned source snapshot
        shell: bash
        run: |
          set -euo pipefail

          source_dir="${RUNNER_TEMP}/handsomeyun-source"
          git init "${source_dir}"
          git -C "${source_dir}" remote add origin https://github.com/HandsomeYun/HandsomeYun.github.io.git
          git -C "${source_dir}" fetch --depth=1 origin 9b98616dd297fd2b597f69782e7c18d902095af2
          git -C "${source_dir}" checkout --detach FETCH_HEAD

          test "$(git -C "${source_dir}" rev-parse HEAD)" = "9b98616dd297fd2b597f69782e7c18d902095af2"

          rsync -a --delete --exclude='.git/' "${source_dir}/" "${GITHUB_WORKSPACE}/"

          cd "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Replace site with HandsomeYun repository snapshot"
          git push origin HEAD:main
